name: Build Ejecutables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear credenciales de Firebase
        shell: bash
        run: |
          mkdir -p config
          if [ -z "${{ secrets.FIREBASE_KEY }}" ]; then
            echo "::error::El secreto FIREBASE_KEY no está configurado. El exe no podrá conectarse."
            exit 1
          fi
          cat > config/firebase-key.json <<'EOF'
          ${{ secrets.FIREBASE_KEY }}
          EOF
          test -s config/firebase-key.json && echo "Credencial creada ($(wc -c < config/firebase-key.json) bytes)"

      - name: Compilar ejecutable Windows
        shell: bash
        run: pyinstaller SistemaAsistencia.spec --noconfirm

      - name: Subir artefacto
        uses: actions/upload-artifact@v5
        with:
          name: SistemaAsistencia-Windows
          path: dist/SistemaAsistencia.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Crear credenciales de Firebase
        shell: bash
        run: |
          mkdir -p config
          if [ -z "${{ secrets.FIREBASE_KEY }}" ]; then
            echo "::error::El secreto FIREBASE_KEY no está configurado. El exe no podrá conectarse."
            exit 1
          fi
          cat > config/firebase-key.json <<'EOF'
          ${{ secrets.FIREBASE_KEY }}
          EOF
          test -s config/firebase-key.json && echo "Credencial creada ($(wc -c < config/firebase-key.json) bytes)"

      - name: Compilar ejecutable Linux
        run: pyinstaller SistemaAsistencia.spec --noconfirm

      - name: Subir artefacto
        uses: actions/upload-artifact@v5
        with:
          name: SistemaAsistencia-Linux
          path: dist/SistemaAsistencia