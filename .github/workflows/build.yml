name: Build Ejecutables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear credenciales de Firebase
        shell: bash
        run: |
          mkdir -p config
          echo '${{ secrets.FIREBASE_KEY }}' > config/firebase-key.json

      - name: Compilar ejecutable Windows
        run: >
          pyinstaller --onefile --windowed
          --name "SistemaAsistencia"
          --icon icon/Fixmol_icon.ico
          --add-data "img/Fixmol3.png;img"
          --add-data "icon/Fixmol_icon.ico;icon"
          --add-data "config/firebase-key.json;config"
          primeraventana.py usuarioventana.py

      - name: Subir artefacto
        uses: actions/upload-artifact@v5
        with:
          name: SistemaAsistencia-Windows
          path: dist/SistemaAsistencia.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Crear credenciales de Firebase
        shell: bash
        run: |
          mkdir -p config
          echo '${{ secrets.FIREBASE_KEY }}' > config/firebase-key.json

      - name: Compilar ejecutable Linux
        run: >
          pyinstaller --onefile --windowed
          --name "SistemaAsistencia"
          --add-data "img/Fixmol3.png:img"
          --add-data "config/firebase-key.json:config"
          primeraventana.py usuarioventana.py

      - name: Subir artefacto
        uses: actions/upload-artifact@v5
        with:
          name: SistemaAsistencia-Linux
          path: dist/SistemaAsistencia